    "/api/v1/public/plans/{id}/duplicate": {
      "post": {
        "summary": "공개 · 계획·할 일 틀 복제",
        "description": "새 기간과 모든 미삭제 원본 할 일의 새 마감일 확인. 실행·완료·회고 미복제. 반환 plan_id로 새 할 일 목록 조회.\n변경 의도마다 소문자 UUID 키를 생성. 통신 재시도에는 본문·키 유지. 같은 키의 다른 경로/본문은 409. 과거 응답 재사용 후에는 최신 상태 재조회.",
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f-]{36}$"
            },
            "description": "고정 plan_id. revision 행 id를 사용하지 않음."
          },
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f-]{36}$"
            },
            "description": "Reuse for retries with the same body; scope checked before cached response. Mismatch returns 409."
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/plan_revisions"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Http400"
          },
          "401": {
            "$ref": "#/components/responses/Http401"
          },
          "403": {
            "$ref": "#/components/responses/Http403"
          },
          "404": {
            "$ref": "#/components/responses/Http404"
          },
          "409": {
            "$ref": "#/components/responses/Http409"
          },
          "429": {
            "$ref": "#/components/responses/Http429"
          },
          "500": {
            "description": "서버/프록시 실패. JSON/본문 모양 보장 없음. 실패를 0건으로 대신 표시하지 않음."
          }
        },
        "security": [
          {
            "csrf": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DuplicateInput"
              },
              "example": {
                "start_date": "2026-09-15",
                "end_date": "2026-09-21",
                "task_due_dates": {
                  "22222222-2222-4222-8222-222222222222": "2026-09-16"
                }
              }
            }
          }
        },
        "operationId": "post_api_v1_public_plans_id_duplicate",
        "tags": [
          "공개 공간"
        ]
      }
    },
